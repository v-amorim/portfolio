# Site Settings
site_name: Vinicius C. Amorim
site_author: Vinicius C. Amorim
site_url: https://v-amorim.github.io/portfolio/
site_description: >-
  Portfólio de Vinicius C. Amorim, Engenheiro de Dados e IA. Plataformas de dados
  com Databricks, PySpark, Azure e GCP, e projetos open source.
docs_dir: docs

exclude_docs: |
  stylesheets/README.md

repo_url: https://github.com/v-amorim/portfolio
repo_name: v-amorim/portfolio

copyright: >
  <a href="https://github.com/v-amorim/portfolio" target="_blank" rel="noopener" style="color: var(--md-primary-fg-color);">Ver o código-fonte deste site</a>

extra_css:
  - stylesheets/global.css
  - stylesheets/components.css
  - stylesheets/page-home.css
  - stylesheets/page-projects.css
  - stylesheets/background-logo.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-config.js
  - javascripts/mermaid-zoom.js
  - javascripts/image-placeholder.js
  - javascripts/projects-filter.js
  - javascripts/lightbox-nav.js
  - javascripts/timeline.js
  - javascripts/background-logo.js

# Material Configuration
theme:
  font: false
  name: material
  language: pt-BR
  custom_dir: templates
  icon:
    logo: logo
    repo: fontawesome/brands/github
  favicon: assets/images/branding/favicon.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - content.code.copy
    - navigation.indexes # Implied section 'index.md' files
    - navigation.sections
    - navigation.tabs # Static upper section tabs (exist)
    - navigation.tabs.sticky # Static upper section tabs (stay)
    - navigation.top
    - search.highlight # Highlight all occurrences of queried string
    - search.share # Search Query can be copied to Clipboard
    - search.suggest # Display likeliest completion for the last queried word
    - toc.follow

nav:
  - Início: index.md
  - Projetos: projects.md
  - Blog:
      - blog/index.md
      - blog/claude-code-data-engineering.md
      - blog/mermaid-examples.md

hooks:
  - hooks/sitemap_copy.py

plugins:
  - social:
      cards: !ENV [CI, false]
  - glightbox:
      loop: true
      skip_classes:
        - profile-picture
  - privacy
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt-BR
          name: Português
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            Portfolio of Vinicius C. Amorim, Data & AI Engineer. Data platforms
            on Databricks, PySpark, Azure and GCP, plus open source projects.
          copyright: >
            <a href="https://github.com/v-amorim/portfolio" target="_blank" rel="noopener" style="color: var(--md-primary-fg-color);">View this site's source code</a>
          theme:
            language: en
            palette:
              - scheme: default
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - scheme: slate
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          nav_translations:
            Início: Home
            Projetos: Projects

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.snippets:
      auto_append:
        - snippets/abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - templates/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          # Not "mermaid": Material would render it in a closed shadow root with its own theme
          class: mermaid-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true

watch:
  - snippets
  - templates

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vinicius-amorim/
    - icon: fontawesome/brands/github
      link: https://github.com/v-amorim
    - icon: fontawesome/solid/paper-plane
      link: mailto:vamorim.dev@gmail.com
